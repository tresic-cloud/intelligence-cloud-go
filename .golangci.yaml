# golangci-lint v1 configuration
run:
  go: "1.25"
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - misspell
    - revive
    - gosec

linters-settings:
  revive:
    rules:
      - name: exported
        severity: warning
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"
  errcheck:
    exclude-functions:
      - (io.Closer).Close
      - (net/http.ResponseWriter).Write
      - fmt.Fprint
      - fmt.Fprintf
      - fmt.Fprintln
      - io.Copy
      - os.Remove
      - os.Unsetenv

issues:
  exclude-rules:
    # Test files: disable gosec (test fixtures with fake creds)
    # and errcheck (intentional ignores in httptest handlers)
    - path: _test\.go
      linters:
        - gosec
        - errcheck
