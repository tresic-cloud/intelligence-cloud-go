name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION_STABLE: "1.25.x"

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION_STABLE }}
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: ./...

  # ── 2. Security ────────────────────────────────────────────────────
  security:
    name: Security
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION_STABLE }}
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  # ── 3. Static analysis ────────────────────────────────────────────
  static:
    name: Static Analysis
    needs: [security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION_STABLE }}
      - name: go vet
        run: go vet ./...
      - name: go build (typecheck)
        run: go build ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: staticcheck
        run: staticcheck ./...

  # ── 4. Tests (matrix) ─────────────────────────────────────────────
  test:
    name: Test (Go ${{ matrix.go-version }})
    needs: [static]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: Upload coverage artifact
        if: matrix.go-version == '1.25.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ── 5. Coverage gate ──────────────────────────────────────────────
  coverage-gate:
    name: Coverage Gate
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION_STABLE }}
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage
      - name: Check coverage threshold (80%)
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $NF}' | tr -d '%')
          echo "Total line coverage: ${TOTAL}%"
          if [ "$(echo "${TOTAL} < 80.0" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${TOTAL}% is below the 80% threshold"
            exit 1
          fi

  # ── 6. Codegen drift ──────────────────────────────────────────────
  codegen-drift:
    name: Codegen Drift
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION_STABLE }}
      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@latest
      - name: Check for codegen drift
        run: bash scripts/codegen_test.sh

  # ── 7. Example build ──────────────────────────────────────────────
  example-build:
    name: Example Build
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION_STABLE }}
      - name: Build examples
        run: |
          if [ -d examples/ ]; then
            go build ./examples/...
          else
            echo "examples/ directory not found, skipping"
          fi

  # ── 8. Cross-platform build matrix ────────────────────────────────
  cross-platform-build-matrix:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION_STABLE }}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          if [ -d cmd/icctl/ ]; then
            go build ./cmd/icctl/
          else
            go build ./...
          fi

  # ── 9. Integration (optional) ─────────────────────────────────────
  integration:
    name: Integration
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION_STABLE }}
      - name: Run integration tests
        if: env.IC_STAGING_TOKEN != ''
        env:
          IC_STAGING_TOKEN: ${{ secrets.IC_STAGING_TOKEN }}
        run: go test -tags=integration ./...
