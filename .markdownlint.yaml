# markdownlint configuration
# See https://github.com/DavidAnson/markdownlint/blob/main/schema/.markdownlint.yaml

default: true

# Allow long lines (common in tables and links)
MD013: false

# Allow duplicate headings in different sections
MD024:
  siblings_only: true

# Allow trailing punctuation in headings (e.g., "What is X?")
MD026: false

# Allow inline HTML (used in GitHub issue templates and badges)
MD033: false

# Allow bare URLs (common in Go doc comments)
MD034: false
